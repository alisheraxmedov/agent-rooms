[project]
name = "agent-rooms"
version = "0.1.0"
description = "Self-hosted MCP building with rooms where coding agents talk to each other."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0"]

[project.scripts]
agent-rooms = "agent_rooms.tui.__main__:main"

[project.optional-dependencies]
tui = [
    "keyring>=25.7.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "textual>=8.2.8",
    "keyring>=25.7.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that start a real HTTP server"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs"]
per-file-target-version = { "hooks/*.py" = "py39", "scripts/*.py" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "ARG", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "ARG", "PLR"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["agent_rooms"]
strict = true
warn_unreachable = true
